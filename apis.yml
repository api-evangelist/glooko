aid: glooko
name: Glooko
description: >-
  Glooko is a diabetes and cardiometabolic data management platform that unifies
  data from more than 200 diabetes and health monitoring devices (blood glucose
  meters, continuous glucose monitors, insulin pumps and pens, and connected
  health devices) into a single view for people with diabetes and their care
  teams. The platform streamlines clinical workflows, surfaces actionable
  insights and population-level analytics for healthcare providers, and supports
  remote patient monitoring, virtual care, and life-sciences research using
  real-world device data. Glooko integrates with major electronic health record
  (EHR) systems via SMART on FHIR and offers an API and EHR integration program
  for device manufacturers, pharmaceutical companies, health systems, and digital
  health partners. Glooko also delivers EndoTool, an inpatient glucose management
  system, through its acquisition of Monarch Medical Technologies.
